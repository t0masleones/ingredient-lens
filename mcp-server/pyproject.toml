[project]
name = "ingredient-lens-mcp"
version = "0.2.0"
description = "MCP server for the Ingredient Lens agent: ingredient database, label rules and human-review queue"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
